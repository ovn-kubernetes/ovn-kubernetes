{{- if eq (hasKey .Values.global "enableOvnKubeIdentity" | ternary .Values.global.enableOvnKubeIdentity true) true }}
# Create self signed CA and webhook cert
# NOTE: The CA and certificate are not renewed after they expire, this should only be used in development environments
{{- $ca := genCA "self-signed-ca" 400 }}
{{- $cert := genSignedCert "localhost" nil (list "localhost") 365 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ovnkube-webhook-cert
  namespace: ovn-kubernetes
data:
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
type: kubernetes.io/tls

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ovn-kubernetes-admission-webhook-node
webhooks:
  - name: ovn-kubernetes-admission-webhook-node.k8s.io
    clientConfig:
      url: https://localhost:9443/node
      caBundle: {{ $ca.Cert | b64enc | quote }}
    admissionReviewVersions: ['v1']
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      # Check all node credentials to enforce metadata/status restrictions.
      # Other callers need validation only when OVN annotations change.
      - name: ovn-node-or-annotation-change
        expression: >-
          request.userInfo.username.startsWith('system:ovn-node') ||
          (has(object.metadata.annotations) &&
           object.metadata.annotations.exists(key,
             key.startsWith('k8s.ovn.org/') &&
             (oldObject == null ||
              !has(oldObject.metadata.annotations) ||
              !(key in oldObject.metadata.annotations) ||
              object.metadata.annotations[key] != oldObject.metadata.annotations[key]))) ||
          (oldObject != null && has(oldObject.metadata.annotations) &&
           oldObject.metadata.annotations.exists(key,
             key.startsWith('k8s.ovn.org/') &&
             (!has(object.metadata.annotations) ||
              !(key in object.metadata.annotations))))
    rules:
      # Callers can supply protected annotations when registering a Node or
      # change them through the main Node resource, bypassing nodes/status checks.
      - operations: [ "CREATE", "UPDATE" ]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["nodes"]
        scope: "Cluster"
      - operations: [ "UPDATE" ]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["nodes/status"]
        scope: "Cluster"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ovn-kubernetes-admission-webhook-pod
webhooks:
  - name: ovn-kubernetes-admission-webhook-pod.k8s.io
    clientConfig:
      url: https://localhost:9443/pod
      caBundle: {{ $ca.Cert | b64enc | quote }}
    admissionReviewVersions: ['v1']
    sideEffects: None
    matchConditions:
      # Avoid a bootstrap dependency on the identity webhook for its own pods:
      # when all identity pods are down, writes to them must not wait for the
      # webhook. Identity pods are recognized by their service account, which
      # cannot be changed on an existing pod, unlike a label.
      # The skip never applies to ovnkube-node credentials, which must always
      # be validated. The same holds for identities configured with
      # --pod-admission-conditions, but this chart configures none. A
      # deployment that does must add each prefix to this expression.
      # It also never applies when the old or the new pod has a protected
      # annotation: adding, removing, or retaining one must invoke admission.
      - name: skip-ovnkube-identity-self-pods
        expression: >-
          request.userInfo.username.startsWith('system:ovn-node') ||
          !(request.namespace == "ovn-kubernetes" &&
          has(object.spec.serviceAccountName) && object.spec.serviceAccountName == "ovnkube-identity" &&
          [object, oldObject].all(p, p == null || !has(p.metadata.annotations) ||
            !["k8s.ovn.org/pod-networks", "k8s.ovn.org/dpu.connection-details",
              "k8s.ovn.org/dpu.connection-status"].exists(k, k in p.metadata.annotations)))
    rules:
      - operations: [ "CREATE", "UPDATE" ]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["pods", "pods/status"]
        scope: "*"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ovn-kubernetes-admission-webhook-uplinkstate
webhooks:
  - name: ovn-kubernetes-admission-webhook-uplinkstate.k8s.io
    clientConfig:
      url: https://localhost:9443/uplinkstate
      caBundle: {{ $ca.Cert | b64enc | quote }}
    admissionReviewVersions: ['v1']
    sideEffects: None
    failurePolicy: Fail
    rules:
      - operations: ["CREATE"]
        apiGroups: ["k8s.ovn.org"]
        apiVersions: ["v1alpha1"]
        resources: ["uplinkstates"]
        scope: "Cluster"
{{- end }}
