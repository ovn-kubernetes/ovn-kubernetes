# ovnkube-identity
# starts ovnkube-identity
# it is run on the master(s).
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: ovnkube-identity
  # namespace set up by install
  namespace: {{ .global.namespace }}
  annotations:
    kubernetes.io/description: |
      This DaemonSet launches the ovnkube-identity networking component on control-plane nodes.
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: ovnkube-identity
  updateStrategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ovnkube-identity
        name: ovnkube-identity
        component: network
        type: infra
        kubernetes.io/os: "linux"
    spec:
      {{- with .global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 6 }}
      {{- end }}
      priorityClassName: "system-cluster-critical"
      serviceAccountName: ovnkube-identity
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
      {{- with get .ovnkubeIdentity "nodePlacement" "nodeSelector" }}
{{ toYaml . | indent 8 }}
      {{- else }}
        node-role.kubernetes.io/control-plane: ""
        kubernetes.io/os: "linux"
      {{- end }}
      {{- with get .ovnkubeIdentity "nodePlacement" "affinity" }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: ovnkube-identity
        {{- $image := .ovnkubeIdentity.ovnkubeIdentity.image }}
        image: "{{ $image.repository }}:{{ $image.tag }}{{ if $image.sha256 }}@sha256:{{ $image.sha256 }}{{ end }}"
        imagePullPolicy: IfNotPresent
        command: ["/root/ovnkube.sh", "ovnkube-identity"]
        securityContext:
          runAsUser: 0
        terminationMessagePolicy: FallbackToLogsOnError
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        volumeMounts:
          - mountPath: /etc/webhook-cert/
            name: webhook-cert
        env:
          {{- if .global.enableCoredump }}
          - name: GOTRACEBACK
            value: "crash"
          {{- end }}
          - name: OVN_DAEMONSET_VERSION
            value: "1.4.0"
          - name: K8S_APISERVER
            valueFrom:
              configMapKeyRef:
                key: k8s_apiserver
                name: ovn-config
          - name: OVNKUBE_LOGLEVEL
            value: "{{ or .ovnkubeIdentity.customVariables.logLevel 4 }}"
          - name: OVN_HYBRID_OVERLAY_ENABLE
            value: "{{ if has "hybridOverlay" .global.featureGates }}true{{ end }}"
      volumes:
        - name: webhook-cert
          secret:
            secretName: ovnkube-webhook-cert
      tolerations:
      {{- with get .ovnkubeIdentity "nodePlacement" "tolerations" }}
{{ toYaml . | indent 6 }}
      {{- else }}
      - operator: "Exists"
      {{- end }}
