# ovnkube-node
# daemonset version 3
# starts node daemons for single node zone ovn stack, each in a separate container
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: ovnkube-node
  # namespace set up by install
  namespace: {{ .global.namespace }}
  annotations:
    kubernetes.io/description: |
      This DaemonSet launches the ovn-kubernetes networking components for worker nodes.
spec:
  selector:
    matchLabels:
      app: ovnkube-node
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ovnkube-node
        name: ovnkube-node
        component: network
        type: infra
        kubernetes.io/os: "linux"
        ovn-db-pod: "true"
    spec:
      priorityClassName: "system-node-critical"
      {{- with .global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 6 }}
      {{- end }}
      serviceAccountName: ovnkube-node
      hostNetwork: true
      dnsPolicy: Default
      hostPID: true
      containers:
      # nb-ovsdb - v3
      - name: nb-ovsdb
        {{- $image := .ovnkubeNode.nbOvsdb.image }}
        image: "{{ $image.repository }}:{{ $image.tag }}{{ if $image.sha256 }}@sha256:{{ $image.sha256 }}{{ end }}"
        imagePullPolicy: IfNotPresent
        command: ["/root/ovnkube.sh", "local-nb-ovsdb"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        # ovn db is stored in the pod in /etc/openvswitch
        # (or in /etc/ovn if OVN from new repository is used,
        # or in /var/lib/ovn if using Debian/Ubuntu packages)
        # and on the host in /var/lib/openvswitch/
        - mountPath: /etc/openvswitch/
          name: host-etc-ovs
        - mountPath: /etc/ovn/
          name: host-var-lib-ovs
        - mountPath: /var/lib/ovn/
          name: host-var-lib-ovs
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /ovn-cert
          name: host-ovn-cert
          readOnly: true
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_NB
          value: "{{ or .ovnkubeNode.customVariables.nbLogLevel "-vconsole:info -vfile:info" }}"
        - name: OVN_GATEWAY_MODE
          value: {{ or .global.gatewayMode "shared" }}
        - name: OVN_ROUTE_ADVERTISEMENTS_ENABLE
          value: "{{ has "routing.routeAdvertisements" .global.featureGates }}"
        - name: OVN_UPLINK_ENABLE
          value: "{{ has "uplink" .global.featureGates }}"
        - name: ENABLE_IPSEC
          value: "false"
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- with .global.metrics.ip }}
        - name: METRICS_IP
          value: "{{ . }}"
        {{- end }}
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovnnb-db"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      # end of container
      # sb-ovsdb - v3
      - name: sb-ovsdb
        {{- $image := .ovnkubeNode.sbOvsdb.image }}
        image: "{{ $image.repository }}:{{ $image.tag }}{{ if $image.sha256 }}@sha256:{{ $image.sha256 }}{{ end }}"
        imagePullPolicy: IfNotPresent
        command: ["/root/ovnkube.sh", "local-sb-ovsdb"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        # ovn db is stored in the pod in /etc/openvswitch
        # (or in /etc/ovn if OVN from new repository is used,
        # or in /var/lib/ovn if using Debian/Ubuntu packages)
        # and on the host in /var/lib/openvswitch/
        - mountPath: /etc/openvswitch/
          name: host-etc-ovs
        - mountPath: /etc/ovn/
          name: host-var-lib-ovs
        - mountPath: /var/lib/ovn/
          name: host-var-lib-ovs
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /ovn-cert
          name: host-ovn-cert
          readOnly: true
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_SB
          value: "{{ or .ovnkubeNode.customVariables.sbLogLevel "-vconsole:info -vfile:info" }}"
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- with .global.metrics.ip }}
        - name: METRICS_IP
          value: "{{ . }}"
        {{- end }}
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovnsb-db"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      # end of container
      # ovn-northd - v3
      - name: ovn-northd
        {{- $image := .ovnkubeNode.ovnNorthd.image }}
        image: "{{ $image.repository }}:{{ $image.tag }}{{ if $image.sha256 }}@sha256:{{ $image.sha256 }}{{ end }}"
        imagePullPolicy: IfNotPresent
        command: ["/root/ovnkube.sh", "run-ovn-northd"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["SYS_NICE"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        # Run directories where we need to be able to access sockets
        - mountPath: /var/run/dbus/
          name: host-var-run-dbus
          readOnly: true
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /ovn-cert
          name: host-ovn-cert
          readOnly: true
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_NORTHD
          value: "{{ or .ovnkubeNode.customVariables.northdLogLevel "-vconsole:info -vfile:info" }}"
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovn-northd"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      # end of container
      - name: ovnkube-controller
        {{- $image := .ovnkubeNode.ovnkubeController.image }}
        image: "{{ $image.repository }}:{{ $image.tag }}{{ if $image.sha256 }}@sha256:{{ $image.sha256 }}{{ end }}"
        imagePullPolicy: IfNotPresent
        command: ["/root/ovnkube.sh", "ovnkube-controller-with-node"]
        securityContext:
          runAsUser: 0
          privileged: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        # Common mounts
        # for the iptables wrapper
        - mountPath: /host
          name: host-slash
          readOnly: true
        - mountPath: /var/lib/kubelet
          name: host-kubelet
          readOnly: true
        - mountPath: /host-kubernetes
          name: host-kubeconfig
          readOnly: true
        - mountPath: /var/run/dbus/
          name: host-var-run-dbus
          readOnly: true
        - mountPath: /var/log/ovn-kubernetes/
          name: host-var-log-ovnkube
          # We mount our socket here
        - mountPath: /var/run/ovn-kubernetes
          name: host-var-run-ovn-kubernetes
        # CNI related mounts which we take over
        - mountPath: /opt/cni/bin
          name: host-opt-cni-bin
        - mountPath: /etc/cni/net.d
          name: host-etc-cni-netd
        # DHCP IPAM delegates to the dhcp CNI plugin, which talks to its
        # daemon over /run/cni/dhcp.sock
        - mountPath: /run/cni
          name: host-run-cni
        - mountPath: /var/run/netns
          name: host-netns
          mountPropagation: HostToContainer
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /ovn-cert
          name: host-ovn-cert
          readOnly: true
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        - mountPath: /etc/openvswitch/
          name: host-etc-ovs
          readOnly: true
        - mountPath: /etc/ovn/
          name: host-var-lib-ovs
          readOnly: true
        - mountPath: /var/lib/ovn/
          name: host-var-lib-ovs
          readOnly: true
        - mountPath: /run/systemd/private
          name: run-systemd
          subPath: private
          readOnly: true
        - mountPath: /var/run/k8s.cni.cncf.io/devinfo/dp
          name: host-devinfo-dp
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        env:
        {{- if .global.enableCoredump }}
        - name: GOTRACEBACK
          value: "crash"
        {{- end }}
        - name: OVN_EGRESSSERVICE_ENABLE
          value: "{{ has "egress.service" .global.featureGates }}"
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVNKUBE_LOGLEVEL
          value: "{{ or .ovnkubeNode.customVariables.ovnkubeNodeLogLevel 4 }}"
        - name: OVNKUBE_LOGFILE_MAXSIZE
          value: "{{ or .ovnkubeNode.customVariables.logFileMaxSize 100 }}"
        - name: OVNKUBE_LOGFILE_MAXBACKUPS
          value: "{{ or .ovnkubeNode.customVariables.logFileMaxBackups 5 }}"
        - name: OVNKUBE_LOGFILE_MAXAGE
          value: "{{ or .ovnkubeNode.customVariables.logFileMaxAge 5 }}"
        - name: OVNKUBE_LIBOVSDB_CLIENT_LOGFILE
          value: "{{ or .ovnkubeNode.customVariables.libovsdbClientLogFile "" }}"
        - name: OVNKUBE_CONFIG_DURATION_ENABLE
          value: ""
        - name: OVNKUBE_METRICS_SCALE_ENABLE
          value: ""
        - name: OVN_NET_CIDR
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: net_cidr
        - name: OVN_SVC_CIDR
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: svc_cidr
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_MTU
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: mtu
        - name: OVN_ROUTABLE_MTU
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: routable_mtu
              optional: true
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- with .global.metrics.ip }}
        - name: METRICS_IP
          value: "{{ . }}"
        {{- end }}
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OVN_GATEWAY_MODE
          value: {{ or .global.gatewayMode "shared" }}
        - name: OVN_GATEWAY_OPTS
          value: ""
        - name: OVN_HYBRID_OVERLAY_ENABLE
          value: "{{ if has "hybridOverlay" .global.featureGates }}true{{ end }}"
        - name: OVN_ADMIN_NETWORK_POLICY_ENABLE
          value: "{{ if has "networkPolicy.admin" .global.featureGates }}true{{ end }}"
        - name: OVN_EGRESSIP_ENABLE
          value: "{{ has "egress.ip" .global.featureGates }}"
        - name: OVN_EGRESSIP_HEALTHCHECK_PORT
          value: "{{ or (get .global.featureGateConfig "egress.ip" "healthCheckPort") 9107 }}"
        - name: OVN_EGRESSFIREWALL_ENABLE
          value: "{{ has "egress.firewall" .global.featureGates }}"
        - name: OVN_EGRESSQOS_ENABLE
          value: "{{ has "egress.qos" .global.featureGates }}"
        - name: OVN_HYBRID_OVERLAY_NET_CIDR
          value: ""
        - name: OVN_DISABLE_SNAT_MULTIPLE_GWS
          value: ""
        - name: OVN_DISABLE_FORWARDING
          value: ""
        - name: OVN_ENCAP_PORT
          value: "6081"
        - name: OVN_DISABLE_PKT_MTU_CHECK
          value: ""
        - name: OVN_NETFLOW_TARGETS
          value: ""
        - name: OVN_SFLOW_TARGETS
          value: ""
        - name: OVN_IPFIX_TARGETS
          value: ""
        - name: OVN_IPFIX_SAMPLING
          value: ""
        - name: OVN_IPFIX_CACHE_MAX_FLOWS
          value: ""
        - name: OVN_IPFIX_CACHE_ACTIVE_TIMEOUT
          value: ""
        - name: OVN_V4_JOIN_SUBNET
          value: "{{ or .global.v4JoinSubnet "100.64.0.0/16" }}"
        - name: OVN_V6_JOIN_SUBNET
          value: "{{ or .global.v6JoinSubnet "fd98::/64" }}"
        - name: OVN_V4_MASQUERADE_SUBNET
          value: "{{ or .global.v4MasqueradeSubnet "169.254.0.0/17" }}"
        - name: OVN_V6_MASQUERADE_SUBNET
          value: "{{ or .global.v6MasqueradeSubnet "fd69::/112" }}"
        - name: OVN_MULTICAST_ENABLE
          value: "{{ if has "multicast" .global.featureGates }}true{{ end }}"
        - name: OVN_UNPRIVILEGED_MODE
          value: "no"
        - name: OVN_EX_GW_NETWORK_INTERFACE
          value: ""
        - name: OVN_SSL_ENABLE
          value: "no"
        - name: OVN_REMOTE_PROBE_INTERVAL
          value: "100000"
        - name: OVN_MONITOR_ALL
          value: ""
        - name: OVN_OFCTRL_WAIT_BEFORE_CLEAR
          value: ""
        - name: OVN_ENABLE_LFLOW_CACHE
          value: "{{ has "lflowCache" .global.featureGates }}"
        - name: OVN_LFLOW_CACHE_LIMIT
          value: "{{ get .global.featureGateConfig "lflowCache" "cacheLimit" }}"
        - name: OVN_LFLOW_CACHE_LIMIT_KB
          value: "{{ get .global.featureGateConfig "lflowCache" "cacheLimitKb" }}"
        # Network segmentation requires multi-network support.
        - name: OVN_MULTI_NETWORK_ENABLE
          value: "{{ has "userDefinedNetworks" .global.featureGates }}"
        - name: OVN_NETWORK_SEGMENTATION_ENABLE
          value: "{{ if has "userDefinedNetworks" .global.featureGates }}true{{ end }}"
        - name: OVN_DISABLE_UDN_ARP_NDP_FLOOD
          value: ""
        - name: OVN_ROUTE_ADVERTISEMENTS_ENABLE
          value: "{{ has "routing.routeAdvertisements" .global.featureGates }}"
        - name: OVN_UPLINK_ENABLE
          value: "{{ has "uplink" .global.featureGates }}"
        - name: OVN_EVPN_ENABLE
          value: "{{ has "routing.evpn" .global.featureGates }}"
        - name: OVN_NETWORK_CONNECT_ENABLE
          value: "{{ if has "userDefinedNetworks.networkConnect" .global.featureGates }}true{{ end }}"
        - name: OVN_PRE_CONF_UDN_ADDR_ENABLE
          value: "{{ if has "userDefinedNetworks.preconfiguredAddresses" .global.featureGates }}true{{ end }}"
        - name: OVN_DYNAMIC_UDN_ALLOCATION
          value: "{{ has "userDefinedNetworks.dynamicUDNAllocation" .global.featureGates }}"
        - name: OVN_DYNAMIC_UDN_GRACE_PERIOD
          value: "{{ get .global.featureGateConfig "userDefinedNetworks.dynamicUDNAllocation" "deletionGracePeriod" }}"
        - name: OVN_ADVERTISED_UDN_ISOLATION_MODE
          value: "{{ or (get .global.featureGateConfig "userDefinedNetworks" "advertisedIsolationMode") "strict" }}"
        - name: OVNKUBE_CLUSTER_DEFAULT_NAD
          value: ""
        - name: OVN_NO_OVERLAY_ENABLE
          value: "{{ has "userDefinedNetworks.noOverlay" .global.featureGates }}"
        - name: OVNKUBE_NODE_MGMT_PORT_NETDEV
          value: ""
        - name: OVNKUBE_NODE_MGMT_PORT_DP_RESOURCE_NAME
          value: ""
        - name: OVN_EMPTY_LB_EVENTS
          value: "{{ or .global.emptyLbEvents "" }}"
        - name: OVN_ACL_LOGGING_RATE_LIMIT
          value: "20"
        - name: OVN_HOST_NETWORK_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: host_network_namespace
        - name: OVN_ENABLE_MULTI_EXTERNAL_GATEWAY
          value: "{{ has "multiExternalGateway" .global.featureGates }}"
        - name: OVN_ENABLE_OVNKUBE_IDENTITY
          value: "{{ has "ovnkubeIdentity" .global.components }}"
        - name: OVN_ENABLE_SVC_TEMPLATE_SUPPORT
          value: "{{ has "serviceTemplateSupport" .global.featureGates }}"
        - name: OVN_ENABLE_DNSNAMERESOLVER
          value: "{{ has "dnsNameResolver" .global.featureGates }}"
        - name: OVN_ALLOW_ICMP_NETPOL
          value: "{{ has "networkPolicy.icmp" .global.featureGates }}"
        - name: OVN_OBSERV_ENABLE
          value: "false"
        - name: OVN_NETWORK_QOS_ENABLE
          value: "{{ has "networkQoS" .global.featureGates }}"
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovnkube-node"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      - name: ovn-controller
        {{- $image := .ovnkubeNode.ovnController.image }}
        image: "{{ $image.repository }}:{{ $image.tag }}{{ if $image.sha256 }}@sha256:{{ $image.sha256 }}{{ end }}"
        imagePullPolicy: IfNotPresent
        command: ["/root/ovnkube.sh", "ovn-controller"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["SYS_NICE"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/run/dbus/
          name: host-var-run-dbus
          readOnly: true
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /ovn-cert
          name: host-ovn-cert
          readOnly: true
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_CONTROLLER
          value: "{{ or .ovnkubeNode.customVariables.ovnControllerLogLevel "-vconsole:info" }}"
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovn-controller"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
        # ovs-metrics-exporter - v3
      - name: ovs-metrics-exporter
        {{- $image := .ovnkubeNode.ovsMetricsExporter.image }}
        image: "{{ $image.repository }}:{{ $image.tag }}{{ if $image.sha256 }}@sha256:{{ $image.sha256 }}{{ end }}"
        imagePullPolicy: IfNotPresent
        command: ["/root/ovnkube.sh", "ovs-metrics"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/run/dbus/
          name: host-var-run-dbus
          readOnly: true
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- with .global.metrics.ip }}
        - name: METRICS_IP
          value: "{{ . }}"
        {{- end }}
        # end of container
      nodeSelector:
      {{- with get .ovnkubeNode "nodePlacement" "nodeSelector" }}
{{ toYaml . | indent 8 }}
      {{- else }}
        kubernetes.io/os: "linux"
      {{- end }}
      affinity:
      {{- with get .ovnkubeNode "nodePlacement" "affinity" }}
{{ toYaml . | indent 8 }}
      {{- else }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: k8s.ovn.org/dpu-host
                operator: DoesNotExist
              - key: k8s.ovn.org/dpu
                operator: DoesNotExist
      {{- end }}
      volumes:
      # Common volumes
      - name: host-var-run-dbus
        hostPath:
          path: /var/run/dbus
      - name: host-kubelet
        hostPath:
          path: /var/lib/kubelet
      - name: host-kubeconfig
        hostPath:
          path: /etc/kubernetes/
      - name: host-var-log-ovnkube
        hostPath:
          path: /var/log/ovn-kubernetes
      - name: host-var-run-ovn-kubernetes
        hostPath:
          path: /var/run/ovn-kubernetes
      - name: host-opt-cni-bin
        hostPath:
          path: /opt/cni/bin
      - name: host-etc-cni-netd
        hostPath:
          path: /etc/cni/net.d
      - name: host-run-cni
        hostPath:
          path: /run/cni
          type: DirectoryOrCreate
      - name: host-slash
        hostPath:
          path: /
      - name: host-netns
        hostPath:
