# This rule is not used by the project ovnk8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the k8s.ovn.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ovnk8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: ovnk8soperator-editor-role
rules:
- apiGroups:
  - k8s.ovn.org
  resources:
  - ovnk8soperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s.ovn.org
  resources:
  - ovnk8soperators/status
  verbs:
  - get
